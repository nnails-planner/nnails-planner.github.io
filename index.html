<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N NAILS Planner</title>
<meta name="description" content="Твоят личен планер от N NAILS: календар, цикъл, цели, книги, пътувания и подаръци. Подарък за нашите клиентки.">
<meta name="theme-color" content="#F2ECE3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="N NAILS Planner">
<meta property="og:description" content="Твоят личен планер — подарък от N NAILS.">
<meta property="og:image" content="img/hero.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Noto+Serif+Display:ital,wght@0,300;0,400;1,300;1,400&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/views/calendar.js">
<!-- Cloudflare Web Analytics (безплатно, без бисквитки) се добавя при качването -->
</head>
<body data-tab="cal">
  <div class="app">
    <header class="top">
      <button class="brand" data-act="go" data-tab="cal" aria-label="Към календара">
        <img src="icons/icon-192.png" alt="" width="36" height="36">
        <span><b>Planner</b><small>by N NAILS</small></span>
      </button>
      <button class="icon-btn" data-act="settings" aria-label="Настройки">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7.5h9M18 7.5h2M4 16.5h3M11 16.5h9"/><circle cx="15.5" cy="7.5" r="2.3"/><circle cx="8.5" cy="16.5" r="2.3"/></svg>
      </button>
    </header>

    <main id="view" class="view"><noscript><p style="padding:24px">Планерът има нужда от JavaScript.</p></noscript></main>

    <nav class="tabs" aria-label="Раздели">
      <button data-act="go" data-tab="cal"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/><path d="M3.5 10h17M8 3.2v3.6M16 3.2v3.6"/></svg><span>Календар</span></button>
      <button data-act="go" data-tab="cycle"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.6c3.3 4.1 6.2 7.4 6.2 10.7a6.2 6.2 0 0 1-12.4 0c0-3.3 2.9-6.6 6.2-10.7Z"/><path d="M9.2 14.6a2.9 2.9 0 0 0 2.6 2.6"/></svg><span>Цикъл</span></button>
      <button data-act="go" data-tab="goals"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg><span>Цели</span></button>
      <button data-act="go" data-tab="corner"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.8s-7.6-4.6-7.6-10.1A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.3c0 5.5-7.6 10.1-7.6 10.1Z"/></svg><span>Кътче</span></button>
      <button data-act="go" data-tab="salon" class="tab-logo"><img src="img/nnails-logo.webp" alt="" width="26" height="26"><span>N NAILS</span></button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
